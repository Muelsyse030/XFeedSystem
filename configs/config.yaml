server:
  port: 8000

mysql:
  dsn: "root:123456@tcp(127.0.0.1:3308)/feed_system?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "127.0.0.1:6380"
  password: ""
  db: 0

jwt:
  # 生产环境必须通过 XFEED_JWT_SECRET 环境变量覆盖
  secret: "dev-secret-change-in-production"
  expire_hours: 72

cos:
  enable: true
  region: "ap-shanghai"
  bucket: "xfeed-1323046323"
  # 生产环境通过 XFEED_COS_SECRET_ID / XFEED_COS_SECRET_KEY 覆盖
  secret_id: ""
  secret_key: ""
  base_url: "https://xfeed-1323046323.cos.ap-shanghai.myqcloud.com"

meilisearch:
  host: "http://127.0.0.1:7700"
  # 生产环境通过 XFEED_MEILISEARCH_API_KEY 覆盖
  api_key: "masterKey"
  index: "notes"

streams:
  key: "xfeed:events"

worker:
  relay_enabled: true
  batch: 100
  poll_interval_ms: 200

event:
  relay:
    batch_size: 500
    interval_ms: 100
  consumer:
    batch_size: 64
    block_ms: 100
  counter:
    flush_interval_ms: 2000
    flush_batch_size: 500
